# Publishes one signed CalBudget APK to a GitHub Release.
# This repository is public, so that Release and the APK are public.
# The same APK is the fresh install and the in-place update.
# The signing key and passwords come only from Actions secrets.
# If any required secret is missing, this job fails and uploads nothing.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calbudget-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the stable signing secrets
        env:
          CALBUDGET_KEYSTORE_BASE64: ${{ secrets.CALBUDGET_KEYSTORE_BASE64 }}
          CALBUDGET_KEYSTORE_PASSWORD: ${{ secrets.CALBUDGET_KEYSTORE_PASSWORD }}
          CALBUDGET_KEY_ALIAS: ${{ secrets.CALBUDGET_KEY_ALIAS }}
          CALBUDGET_KEY_PASSWORD: ${{ secrets.CALBUDGET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CALBUDGET_KEYSTORE_BASE64 CALBUDGET_KEYSTORE_PASSWORD CALBUDGET_KEY_ALIAS CALBUDGET_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Signing secret missing::GitHub Actions secret ${name} is not set. Refusing to build or publish an APK signed with any other key."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode the signing keystore
        env:
          CALBUDGET_KEYSTORE_BASE64: ${{ secrets.CALBUDGET_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CALBUDGET_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/calbudget.keystore"
          if [ ! -s "$RUNNER_TEMP/calbudget.keystore" ]; then
            echo "::error::The decoded keystore is empty. Refusing to publish."
            exit 1
          fi

      - name: Build the signed release
        env:
          CALBUDGET_KEYSTORE_PATH: ${{ runner.temp }}/calbudget.keystore
          CALBUDGET_KEYSTORE_PASSWORD: ${{ secrets.CALBUDGET_KEYSTORE_PASSWORD }}
          CALBUDGET_KEY_ALIAS: ${{ secrets.CALBUDGET_KEY_ALIAS }}
          CALBUDGET_KEY_PASSWORD: ${{ secrets.CALBUDGET_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Read the version and certificate
        id: version
        run: |
          set -euo pipefail
          name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName or versionCode."
            exit 1
          fi
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signed release APK is missing. Refusing to publish an unsigned or debug APK."
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          digest="$(sed -n 's/.*SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1)"
          if [ -z "$digest" ]; then
            echo "::error::Release APK has no signing certificate. Refusing to publish."
            exit 1
          fi
          asset="$RUNNER_TEMP/CalBudget-${name}.apk"
          cp "$apk" "$asset"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CERT_SHA256: ${{ steps.version.outputs.digest }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          title="CalBudget ${VERSION_NAME}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "Install this APK for a new install or an in-place update. It is the same file for both."
            echo
            echo "- versionName: ${VERSION_NAME}"
            echo "- versionCode: ${VERSION_CODE}"
            echo "- signing certificate SHA-256: ${CERT_SHA256}"
            echo
            echo "The signing key is not in this release. An update installs only when this certificate matches the one already on the device and versionCode is not lower."
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ASSET" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes_file" --latest
          else
            gh release create "$tag" "$ASSET" --title "$title" --notes-file "$notes_file" --latest --target "$GITHUB_SHA"
          fi
