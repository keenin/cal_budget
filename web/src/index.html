<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="What you owe until payday. Bills, housing, and cards stay on this device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cal Budget">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Cal Budget</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme-boot.js"></script>
</head>
<body>
  <div class="shell">
    <header class="bar" id="bar"></header>
    <main class="view" id="view"></main>
  </div>
  <div id="menu"></div>
  <div id="sheet"></div>
  <div id="modal"></div>
  <div id="toast" class="toast" hidden role="status"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript>
    <p class="noscript">Cal Budget needs JavaScript. It still keeps everything on this device — there is no account.</p>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
